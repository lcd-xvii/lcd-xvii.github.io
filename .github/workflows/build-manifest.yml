name: Build docs manifest

on:
  push:
    branches: [main]
    paths:
      - 'oi-docs/*.md'
      - 'oi-docs/**/*.md'
      - '.github/scripts/build-manifest.mjs'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate manifest
        run: node .github/scripts/build-manifest.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oi-docs/manifest.json oi-docs/search-index.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update oi-docs manifest [skip ci]"
            git push
          fi