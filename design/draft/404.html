<link rel="stylesheet" href="ds.css">
<style>
  .nf{padding:clamp(88px,16vh,160px) 0 0}
  .nf .code{
    margin:0 0 28px;
    font-family:var(--font-serif);
    font-size:clamp(88px,17vw,168px);
    font-weight:400;
    line-height:.88;
    letter-spacing:-.045em;
  }
  .nf .code em{font-style:italic;color:var(--accent-ink)}
  .nf .lead{max-width:26ch}
  .nf .links{display:flex;flex-wrap:wrap;gap:32px;margin-top:40px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="index.html">lcd-xvii</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="index.html#about">关于</a>
      <a href="index.html#contact">联系</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="nf reveal">
    <p class="code">4<em>0</em>4</p>
    <p class="lead">这一页不在这里。</p>
    <div class="links">
      <a class="arrow" href="index.html">回到首页</a>
    </div>
  </section>
</main>

<script>
(function () {
  var items = document.querySelectorAll('.reveal');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window)) {
    items.forEach(function (el) { el.classList.add('is-in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) { entry.target.classList.add('is-in'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.1 });
  items.forEach(function (el) { io.observe(el); });
})();
</script>
</body>
