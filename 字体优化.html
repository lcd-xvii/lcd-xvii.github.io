<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OI Docs</title>

<!-- ============================================================
     外部依赖（CDN，不嵌入）
     ============================================================ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

<script>
(function () {
  var saved = localStorage.getItem('oi-docs-theme');
  var theme = (saved === 'dark' || saved === 'ayu' || saved === 'light') ? saved : 'light';
  document.documentElement.dataset.theme = theme;
})();
</script>

<style>
  /* ============================================================
   * 布局变量
   * ============================================================ */
  :root {
    --topbar-h: 45px;
    --sidebar-w: 220px;
    --tt: background-color .15s ease, color .15s ease, border-color .15s ease;
  }

  /* ============================================================
   * 主题配色（对齐 rustdoc 三套主题的取值）
   * ============================================================ */
  :root, [data-theme="light"] {
    --bg: #ffffff;
    --bg-soft: #f5f5f5;
    --sidebar-bg: #fafafa;
    --text: #000000;
    --text-soft: #666666;
    --border: #e0e0e0;
    --border-strong: #cccccc;
    --accent: #3873ad;
    --accent-soft: #eaf2fb;
    --code-bg: #f5f5f5;
    --code-block-bg: #f6f7f8;
    --code-block-fg: #000000;
    --code-border: #e0e0e0;
    --btn-bg: #f5f5f5;
    --btn-hover: #e5e5e5;
    --hover-bg: #e5e5e5;
    --scrollbar: #c7c7c7;
    --shadow: rgba(0, 0, 0, 0.10);
    --search-bg: #f5f5f5;

    --hl-keyword: #8959a8;
    --hl-title: #4271ae;
    --hl-attr: #c82829;
    --hl-string: #718c00;
    --hl-builtin: #f5871f;
    --hl-comment: #8e908c;
    --hl-name: #4271ae;
    --hl-subst: #000000;
    --hl-section: #4271ae;
    --hl-bullet: #718c00;
    --hl-emphasis: #000000;
    --hl-add-fg: #718c00; --hl-add-bg: #eaffea;
    --hl-del-fg: #c82829; --hl-del-bg: #ffeeee;
  }

  [data-theme="dark"] {
    --bg: #2a2a2a;
    --bg-soft: #353535;
    --sidebar-bg: #2f2f2f;
    --text: #dddddd;
    --text-soft: #999999;
    --border: #4a4a4a;
    --border-strong: #5a5a5a;
    --accent: #76ae4b;
    --accent-soft: #2d3b2d;
    --code-bg: #383838;
    --code-block-bg: #383838;
    --code-block-fg: #dddddd;
    --code-border: #4a4a4a;
    --btn-bg: #383838;
    --btn-hover: #4a4a4a;
    --hover-bg: #4a4a4a;
    --scrollbar: #555555;
    --shadow: rgba(0, 0, 0, 0.35);
    --search-bg: #383838;

    --hl-keyword: #ee6868;
    --hl-title: #769acb;
    --hl-attr: #ee6868;
    --hl-string: #2bab63;
    --hl-builtin: #ee6868;
    --hl-comment: #999999;
    --hl-name: #2bab63;
    --hl-subst: #dddddd;
    --hl-section: #769acb;
    --hl-bullet: #2bab63;
    --hl-emphasis: #dddddd;
    --hl-add-fg: #2bab63; --hl-add-bg: #1e3a2a;
    --hl-del-fg: #ee6868; --hl-del-bg: #3a1e1e;
  }

  [data-theme="ayu"] {
    --bg: #0f1419;
    --bg-soft: #1c2228;
    --sidebar-bg: #131920;
    --text: #c5c5c5;
    --text-soft: #8a9199;
    --border: #2d353e;
    --border-strong: #3a424c;
    --accent: #ffb44c;
    --accent-soft: #2d2415;
    --code-bg: #1c2228;
    --code-block-bg: #1c2228;
    --code-block-fg: #c5c5c5;
    --code-border: #2d353e;
    --btn-bg: #1c2228;
    --btn-hover: #2d353e;
    --hover-bg: #2d353e;
    --scrollbar: #3a424c;
    --shadow: rgba(0, 0, 0, 0.5);
    --search-bg: #1c2228;

    --hl-keyword: #ff7733;
    --hl-title: #ffb44c;
    --hl-attr: #ff7733;
    --hl-string: #b8cc52;
    --hl-builtin: #ff7733;
    --hl-comment: #5c6773;
    --hl-name: #b8cc52;
    --hl-subst: #c5c5c5;
    --hl-section: #ffb44c;
    --hl-bullet: #b8cc52;
    --hl-emphasis: #c5c5c5;
    --hl-add-fg: #b8cc52; --hl-add-bg: #1a2a1a;
    --hl-del-fg: #ff7733; --hl-del-bg: #2a1a1a;
  }

  /* 主题切换瞬间禁用过渡，保证背景“秒切” */
  html.theme-switching *,
  html.theme-switching *::before,
  html.theme-switching *::after {
    transition: none !important;
  }

  /* ============================================================
   * 基础
   * ============================================================ */
  html { background: var(--bg); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  code, pre, kbd, samp, .mono {
    font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, Menlo,
                 Consolas, "Courier New", monospace;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============================================================
   * 顶栏（rustdoc-topbar 风格）
   * ============================================================ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .menu-toggle {
    display: none;
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--btn-bg);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: var(--tt);
  }
  .menu-toggle:hover { background: var(--btn-hover); }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    color: var(--text);
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    white-space: nowrap;
    padding: 2px 4px;
    border-radius: 4px;
    transition: var(--tt);
  }
  .brand:hover { text-decoration: none; background: var(--hover-bg); }
  .brand-logo {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    background: linear-gradient(135deg, #0969da, #8250df);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  /* ---------- 搜索 ---------- */
  .search-container {
    position: relative;
    flex: 1;
    max-width: 560px;
    margin-left: 6px;
  }
  .search-input {
    width: 100%;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--search-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: var(--tt);
  }
  .search-input::placeholder { color: var(--text-soft); }
  .search-input:focus { border-color: var(--accent); background: var(--bg); }

  .search-results {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 70;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 8px 24px var(--shadow);
    max-height: 60vh;
    overflow-y: auto;
  }
  .search-results.show { display: block; }

  .search-result {
    display: block;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover,
  .search-result.sel { background: var(--hover-bg); text-decoration: none; }

  .search-result .sr-title {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-result .sr-cat {
    font-size: 11px;
    color: var(--text-soft);
    margin-left: 6px;
    font-weight: 400;
  }
  .search-result .sr-snippet {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .search-result mark {
    background: rgba(255, 200, 0, .45);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  [data-theme="dark"] .search-result mark,
  [data-theme="ayu"] .search-result mark {
    background: rgba(255, 200, 0, .30);
  }
  .search-empty {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-soft);
  }

  /* ---------- 顶栏按钮 ---------- */
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .icon-btn {
    width: 30px;
    height: 30px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--text-soft);
    font-size: 15px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: var(--tt);
    line-height: 1;
  }
  .icon-btn:hover {
    background: var(--hover-bg);
    color: var(--text);
  }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ============================================================
   * 布局
   * ============================================================ */
  .page-layout {
    display: flex;
    min-height: calc(100vh - var(--topbar-h));
  }

  /* ---------- 侧栏（rustdoc sidebar 风格） ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    position: sticky;
    top: var(--topbar-h);
    height: calc(100vh - var(--topbar-h));
    overflow-y: auto;
    overflow-x: hidden;
    font-size: 14px;
    transition: transform .25s ease;
  }

  .sidebar-crate {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 8px;
  }
  .crate-logo {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    background: linear-gradient(135deg, #0969da, #8250df);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    text-decoration: none;
  }
  .crate-logo:hover { text-decoration: none; opacity: .9; }
  .sidebar-crate h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  .sidebar-crate h2 a {
    color: var(--text);
    text-decoration: none;
  }
  .sidebar-crate h2 a:hover { color: var(--accent); text-decoration: none; }

  .sidebar-elems { padding: 0 0 40px; }

  .sidebar-block-link {
    display: block;
    padding: 3px 14px;
    color: var(--accent);
    font-size: 14px;
    text-decoration: none;
    border-radius: 4px;
    margin: 0 4px 6px;
  }
  .sidebar-block-link:hover { background: var(--hover-bg); text-decoration: none; }

  .sidebar-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    padding: 12px 14px 3px;
    margin: 0;
    letter-spacing: .2px;
    text-transform: none;
  }

  /* ---------- 标签云 ---------- */
  .tag-cloud { padding: 0 10px 4px; }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 4px;
  }
  .tag {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 0 7px;
    border-radius: 999px;
    cursor: pointer;
    transition: var(--tt);
    line-height: 1.7;
  }
  .tag:hover { border-color: var(--accent); }
  .tag .tag-count {
    margin-left: 3px;
    color: var(--text-soft);
    font-size: 11px;
  }
  .tag.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .tag-clear {
    display: block;
    margin: 2px 0 0;
    border: none;
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }
  .tag-clear:hover { text-decoration: underline; }

  /* ---------- 导航 ---------- */
  .nav-group { margin-bottom: 1px; }
  .nav-group-title {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    margin: 0 4px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    border-radius: 4px;
    transition: var(--tt);
  }
  .nav-group-title:hover { background: var(--hover-bg); }
  .nav-group-title .caret {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    transition: transform .15s ease;
    flex-shrink: 0;
    opacity: .8;
  }
  .nav-group.collapsed .caret { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-items { display: none; }
  .nav-group-title .nav-icon {
    font-size: 13px;
    flex-shrink: 0;
  }
  .nav-group-title .count {
    margin-left: auto;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-soft);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0 6px;
    border-radius: 999px;
    line-height: 1.5;
  }

  .nav-items {
    list-style: none;
    margin: 0 0 4px;
    padding: 0;
  }
  .nav-items li a {
    display: block;
    padding: 2px 10px 2px 28px;
    margin: 0 4px;
    border-radius: 4px;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: var(--tt);
  }
  .nav-items li a:hover {
    background: var(--hover-bg);
    text-decoration: none;
  }
  .nav-items li a.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .nav-empty {
    padding: 4px 14px;
    font-size: 13px;
    color: var(--text-soft);
  }

  /* ---------- 主内容 ---------- */
  .main-content {
    flex: 1;
    min-width: 0;
    padding: 24px 32px 80px;
  }
  .article { max-width: 860px; margin: 0 auto; }

  /* ============================================================
   * 欢迎页
   * ============================================================ */
  .hero { text-align: center; padding: 32px 0 16px; }
  .hero h1 {
    font-size: 2.2em;
    margin: 0 0 8px;
    font-weight: 700;
  }
  .hero p { color: var(--text-soft); font-size: 16px; margin: 0 0 24px; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    background: var(--bg-soft);
    text-align: left;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .card:hover {
    transform: translateY(-1px);
    border-color: var(--accent);
  }
  .card .card-icon { font-size: 20px; }
  .card h3 { margin: 6px 0 3px; font-size: 16px; font-weight: 600; }
  .card p { margin: 0; font-size: 13px; color: var(--text-soft); }

  /* ============================================================
   * 文章头部
   * ============================================================ */
  .article-title {
    font-size: 1.8em;
    margin: 0 0 8px;
    font-weight: 700;
    line-height: 1.3;
  }
  .article-meta {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 22px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .tag-badge {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text-soft);
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
  }

  /* ============================================================
   * TOC
   * ============================================================ */
  .toc {
    margin: 0 0 22px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-soft);
    font-size: 13px;
    overflow: hidden;
  }
  .toc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 700;
    color: var(--text-soft);
    user-select: none;
  }
  .toc.collapsed .toc-list { display: none; }
  .toc-list {
    list-style: none;
    margin: 0;
    padding: 0 8px 8px;
    max-height: calc(100vh - 220px);
    overflow-y: auto;
  }
  .toc-list a {
    display: block;
    padding: 2px 10px;
    border-radius: 4px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: var(--tt);
  }
  .toc-list a:hover { background: var(--hover-bg); text-decoration: none; }
  .toc-list a.active {
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 600;
  }
  .toc-list .toc-l1 { padding-left: 10px; }
  .toc-list .toc-l2 { padding-left: 10px; }
  .toc-list .toc-l3 { padding-left: 24px; }
  .toc-list .toc-l4 { padding-left: 38px; }

  @media (min-width: 1600px) {
    .toc {
      position: fixed;
      right: 16px;
      top: calc(var(--topbar-h) + 20px);
      width: 210px;
      max-height: calc(100vh - 100px);
      margin: 0;
      z-index: 10;
    }
    .toc.collapsed .toc-list { display: block; }
  }

  /* ============================================================
   * Markdown 正文
   * ============================================================ */
  .md h1, .md h2, .md h3, .md h4 {
    line-height: 1.35;
    margin-top: 1.5em;
    margin-bottom: .55em;
    font-weight: 700;
  }
  .md h1 {
    font-size: 1.7em;
    border-bottom: 1px solid var(--border);
    padding-bottom: .3em;
  }
  .md h2 {
    font-size: 1.4em;
    border-bottom: 1px solid var(--border);
    padding-bottom: .3em;
  }
  .md h3 { font-size: 1.2em; }
  .md h4 { font-size: 1.05em; }
  .md p { margin: 0 0 1em; }
  .md ul, .md ol { padding-left: 1.7em; margin: 0 0 1em; }
  .md li { margin: .2em 0; }

  .md blockquote {
    margin: 0 0 1em;
    padding: .5em 1em;
    border-left: 4px solid var(--border-strong);
    color: var(--text-soft);
    background: var(--bg-soft);
    border-radius: 0 4px 4px 0;
  }

  .md code {
    background: var(--code-bg);
    padding: .1em .35em;
    border-radius: 3px;
    font-size: .875em;
  }
  .md pre {
    position: relative;
    background: var(--code-block-bg);
    color: var(--code-block-fg);
    padding: 14px 16px;
    border-radius: 4px;
    border: 1px solid var(--code-border);
    overflow-x: auto;
    margin: 0 0 1em;
    font-size: 14px;
    line-height: 1.6;
  }
  .md pre code {
    background: transparent;
    padding: 0;
    border-radius: 0;
    color: inherit;
    font-size: inherit;
  }
  .md pre.hljs { background: var(--code-block-bg); }
  .md pre code.hljs { background: transparent; padding: 0; }

  /* ---------- highlight.js 配色 ---------- */
  .hljs { color: inherit; }
  .hljs-keyword, .hljs-doctag, .hljs-template-tag, .hljs-template-variable, .hljs-type, .hljs-variable.language_ { color: var(--hl-keyword); }
  .hljs-title, .hljs-title.class_, .hljs-title.function_ { color: var(--hl-title); }
  .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-meta, .hljs-number, .hljs-operator, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-variable { color: var(--hl-attr); }
  .hljs-string, .hljs-regexp { color: var(--hl-string); }
  .hljs-built_in, .hljs-symbol { color: var(--hl-builtin); }
  .hljs-comment, .hljs-code, .hljs-formula { color: var(--hl-comment); }
  .hljs-name, .hljs-quote, .hljs-selector-pseudo, .hljs-selector-tag { color: var(--hl-name); }
  .hljs-subst { color: var(--hl-subst); }
  .hljs-section { color: var(--hl-section); font-weight: bold; }
  .hljs-bullet { color: var(--hl-bullet); }
  .hljs-emphasis { color: var(--hl-emphasis); font-style: italic; }
  .hljs-strong { color: var(--hl-emphasis); font-weight: bold; }
  .hljs-addition { color: var(--hl-add-fg); background-color: var(--hl-add-bg); }
  .hljs-deletion { color: var(--hl-del-fg); background-color: var(--hl-del-bg); }

  /* ---------- 复制按钮 ---------- */
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 2;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-soft);
    font-family: inherit;
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, background-color .15s ease, color .15s ease, border-color .15s ease;
    line-height: 1.6;
  }
  .md pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover {
    background: var(--bg-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .copy-btn.copied { color: var(--accent); border-color: var(--accent); }

  .md table {
    border-collapse: collapse;
    width: 100%;
    margin: 0 0 1em;
    font-size: 14px;
  }
  .md th, .md td {
    border: 1px solid var(--border);
    padding: 6px 12px;
    text-align: left;
  }
  .md th { background: var(--bg-soft); }
  .md img { max-width: 100%; border-radius: 4px; }
  .md hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
  }
  .md .katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    margin: 1em 0;
    text-align: center;
  }

  /* ============================================================
   * 加载 / 错误
   * ============================================================ */
  .loading {
    color: var(--text-soft);
    padding: 60px 0;
    text-align: center;
  }
  .loading::before {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    vertical-align: -2px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    color: #cf222e;
    background: #ffebe9;
    border: 1px solid #ff8182;
    padding: 16px;
    border-radius: 4px;
    margin: 20px 0;
    font-size: 14px;
    line-height: 1.8;
  }
  .error code {
    background: rgba(0, 0, 0, .06);
    padding: 1px 6px;
    border-radius: 3px;
  }
  [data-theme="dark"] .error {
    background: #3d1d1f;
    color: #ff8182;
    border-color: #6b2b2f;
  }
  [data-theme="dark"] .error code { background: rgba(255, 255, 255, .08); }
  [data-theme="ayu"] .error {
    background: #2a1a1a;
    color: #ff7733;
    border-color: #4a2a1a;
  }
  [data-theme="ayu"] .error code { background: rgba(255, 255, 255, .06); }

  /* ============================================================
   * 遮罩 / 帮助
   * ============================================================ */
  .backdrop {
    display: none;
    position: fixed;
    inset: var(--topbar-h) 0 0 0;
    background: rgba(0, 0, 0, .4);
    z-index: 44;
  }
  .backdrop.show { display: block; }

  .help-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(0, 0, 0, .45);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .help-overlay.show { display: flex; }

  .help-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 50px var(--shadow);
  }
  .help-card h3 { margin: 0 0 12px; font-size: 16px; }
  .help-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .help-card td { padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .help-card td:first-child { width: 110px; }
  .help-card kbd {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 12px;
  }

  /* ============================================================
   * 响应式
   * ============================================================ */
  @media (max-width: 860px) {
    .menu-toggle { display: inline-flex; }

    .sidebar {
      position: fixed;
      top: var(--topbar-h);
      left: 0;
      bottom: 0;
      z-index: 45;
      transform: translateX(-100%);
      height: calc(100vh - var(--topbar-h));
      box-shadow: 2px 0 12px var(--shadow);
    }
    .sidebar.open { transform: translateX(0); }

    .main-content { padding: 18px 16px 60px; }
    .brand-text { display: none; }
    .hero h1 { font-size: 1.8em; }
    .article-title { font-size: 1.5em; }
  }
</style>
</head>
<body>

<!-- ============================================================
     顶栏
     ============================================================ -->
<header class="topbar">

  <div class="search-container">

           placeholder="搜索文档…（按 / 聚焦）" autocomplete="off" spellcheck="false">

  </div>

  <div class="topbar-actions">

    <button class="icon-btn" id="helpBtn" title="快捷键 (?)"><i class="bi bi-question-circle"></i></button>

</header>

<!-- ============================================================
     主体
     ============================================================ -->
<div class="page-layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-crate">
      <a class="crate-logo" href="#" title="回到首页">OI</a>
      <h2><a href="#" class="brand">OI Docs</a></h2>
    </div>
    <div class="sidebar-elems">
      <a class="sidebar-block-link" href="#" id="allItemsLink">全部条目</a>

      <section>
        <h3 class="sidebar-section-title">标签</h3>
        <div class="tag-cloud" id="tagCloud"></div>
      </section>

      <section>
        <h3 class="sidebar-section-title">目录</h3>
        <div id="nav"></div>
      </section>
    </div>
  </nav>

  <div class="backdrop" id="backdrop"></div>

  <main class="main-content">
    <div id="content"></div>
  </main>

<!-- ============================================================
     帮助浮层
     ============================================================ -->
<div class="help-overlay" id="helpOverlay">
  <div class="help-card">
    <h3>快捷键</h3>
    <table>
      <tr><td><kbd>/</kbd></td><td>聚焦搜索</td></tr>
      <tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></td><td>搜索结果选择 / 打开</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>关闭面板 / 取消聚焦</td></tr>
      <tr><td><kbd>t</kbd></td><td>切换主题</td></tr>
      <tr><td><kbd>g</kbd> <kbd>h</kbd></td><td>回到首页</td></tr>
      <tr><td><kbd>?</kbd></td><td>显示本帮助</td></tr>
    </table>
  </div>
</div>

<script type="module">
/* ================================================================
 * 1. ESM 导入（CDN）
 * ================================================================ */
import markdownit from 'https://esm.sh/markdown-it@14.1.0';
import markdownItKatex from 'https://esm.sh/@vscode/markdown-it-katex@1.1.2';
import hljs from 'https://esm.sh/highlight.js@11.9.0';

/* ================================================================
 * 2. 配置
 * ================================================================ */
const CONFIG = {
  owner:  'lcd-xvii',
  repo:   'oi-docs',
  branch: 'main',
  contentRoot: '',
  treeCacheTTL: 10 * 60 * 1000,
  docCacheTTL:  24 * 60 * 60 * 1000,
};

const CATEGORY_META = {
  '题解':     { icon: '📝', order: 1 },
  '总结':     { icon: '📋', order: 2 },
  '算法理论': { icon: '📚', order: 3 },
  '杂项':     { icon: '📁', order: 999 },
};

/* ================================================================
 * 3. Markdown
 * ================================================================ */
const md = markdownit({
  html: true, linkify: true, typographer: true, breaks: false,
  highlight(str, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try {
        return '<pre class="hljs"><code>' +
          hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
          '</code></pre>';
      } catch (__) {}
    }
    return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
  }
});
md.use(markdownItKatex, { throwOnError: false, errorColor: '#cf222e' });

/* ================================================================
 * 4. 基础设施
 * ================================================================ */
const $ = s => document.querySelector(s);
const ROOT = CONFIG.contentRoot ? CONFIG.contentRoot.replace(/^\/+|\/+$/g, '') + '/' : '';
const RAW_BASE = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/`;
const API_BASE = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`;
const CACHE_KEY = `oi-docs-tree:${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${ROOT}`;
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const encodePath = p => p.split('/').map(encodeURIComponent).join('/');
const resolvePath = (dir, rel) => { const out=[]; (dir+rel).split('/').forEach(p=>{if(!p||p==='.')return;if(p==='..')out.pop();else out.push(p);}); return out.join('/'); };

/* ================================================================
 * 5. IndexedDB
 * ================================================================ */
const idb = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const req = indexedDB.open('oi-docs', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs');
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return dbp;
  }
  async function get(store, key) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const r = db.transaction(store, 'readonly').objectStore(store).get(key);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch { return null; }
  }
  async function set(store, key, val) {
    try {
      const db = await open();
      await new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val, key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch {}
  }
  async function clear(store) {
    try {
      const db = await open();
      await new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).clear();
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch {}
  }
  return { get, set, clear };
})();

/* ================================================================
 * 6. 数据获取
 * ================================================================ */
async function fetchTree(force = false) {
  if (!force) {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && Date.now() - cached.time < CONFIG.treeCacheTTL) return cached.data;
    } catch {}
  }
  const headers = { 'Accept': 'application/vnd.github+json' };
  const tryBranch = async branch => fetch(`${API_BASE}/git/trees/${branch}?recursive=1`, { headers });
  let res = await tryBranch(CONFIG.branch);
  if (res.status === 404 && CONFIG.branch === 'main') res = await tryBranch('master');
  if (!res.ok) {
    if (res.status === 403 || res.status === 429) throw new Error('GitHub API 速率限制（匿名 60 次/小时），请稍后重试。');
    throw new Error(`拉取文件列表失败：HTTP ${res.status}`);
  }
  const data = await res.json();
  if (data.truncated) console.warn('[OI Docs] 文件树被截断，部分文档可能未显示');
  localStorage.setItem(CACHE_KEY, JSON.stringify({ data, time: Date.now() }));
  return data;
}

async function fetchMarkdown(path) {
  const cached = await idb.get('docs', path);
  if (cached && Date.now() - cached.time < CONFIG.docCacheTTL) return cached.text;
  const res = await fetch(RAW_BASE + encodePath(ROOT + path), { cache: 'no-cache' });
  if (!res.ok) {
    if (cached) return cached.text;
    throw new Error(`HTTP ${res.status} — ${path}`);
  }
  const text = await res.text();
  idb.set('docs', path, { text, time: Date.now() });
  return text;
}

async function loadManifest(force = false) {
  if (!force) {
    const cached = await idb.get('meta', 'manifest');
    if (cached && Date.now() - cached.time < CONFIG.treeCacheTTL) return cached.data;
  }
  const res = await fetch(RAW_BASE + 'manifest.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('manifest.json 不存在');
  const data = await res.json();
  idb.set('meta', 'manifest', { data, time: Date.now() });
  return data;
}

async function loadSearchIndex() {
  if (SEARCH_INDEX) return SEARCH_INDEX;
  const cached = await idb.get('meta', 'search-index');
  if (cached && Date.now() - cached.time < CONFIG.treeCacheTTL) {
    SEARCH_INDEX = cached.data;
    return SEARCH_INDEX;
  }
  const res = await fetch(RAW_BASE + 'search-index.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('search-index.json 不存在');
  SEARCH_INDEX = await res.json();
  idb.set('meta', 'search-index', { data: SEARCH_INDEX, time: Date.now() });
  return SEARCH_INDEX;
}

/* ================================================================
 * 7. 构建分类
 * ================================================================ */
let CATEGORIES = [];
let MANIFEST = null;
let SEARCH_INDEX = null;
let ITEM_MAP = new Map();
let activeTag = null;
let currentPath = null;
let treeLoaded = false;

function buildDocs(tree) {
  const blobs = (tree.tree || [])
    .filter(t => t.type === 'blob' && /\.md$/i.test(t.path))
    .filter(t => !t.path.split('/').some(seg => seg.startsWith('.')))
    .filter(t => !/^_/.test(t.path.split('/').pop()))
    .filter(t => !ROOT || t.path.startsWith(ROOT))
    .map(t => ROOT ? t.path.slice(ROOT.length) : t.path);

  const groups = new Map();
  for (const path of blobs) {
    const parts = path.split('/');
    const catName = parts.length === 1 ? '杂项' : parts[0];
    const title = parts[parts.length - 1].replace(/\.md$/i, '');
    if (!groups.has(catName)) groups.set(catName, []);
    groups.get(catName).push({ path, title, tags: [], date: '', summary: '' });
  }
  return finalizeCategories(groups);
}

function buildFromManifest(manifest) {
  const groups = new Map();
  for (const d of manifest.docs || []) {
    if (ROOT && !d.path.startsWith(ROOT)) continue;
    const path = ROOT ? d.path.slice(ROOT.length) : d.path;
    const parts = path.split('/');
    const catName = parts.length === 1 ? '杂项' : parts[0];
    if (!groups.has(catName)) groups.set(catName, []);
    groups.get(catName).push({
      path,
      title: d.title || parts[parts.length - 1].replace(/\.md$/i, ''),
      tags: Array.isArray(d.tags) ? d.tags : [],
      date: d.date || '',
      summary: d.summary || '',
    });
  }
  return finalizeCategories(groups);
}

function finalizeCategories(groups) {
  const arr = [...groups.entries()].map(([name, items]) => {
    const meta = CATEGORY_META[name] || {};
    items.sort((a, b) =>
      (b.date || '').localeCompare(a.date || '') ||
      a.title.localeCompare(b.title, 'zh-CN'));
    return { name, icon: meta.icon || '📁', order: meta.order ?? 500, items, collapsed: false };
  });
  arr.sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'zh-CN'));
  return arr;
}

function rebuildItemMap() {
  ITEM_MAP = new Map();
  for (const c of CATEGORIES) for (const it of c.items) ITEM_MAP.set(it.path, { ...it, cat: c.name });
}

/* ================================================================
 * 8. 侧边栏 + 标签云
 * ================================================================ */
function renderSidebar(keyword = '') {
  const q = keyword.trim().toLowerCase();
  let html = '';
  CATEGORIES.forEach((cat, ci) => {
    let items = cat.items;
    if (activeTag) items = items.filter(it => (it.tags || []).includes(activeTag));
    if (q) items = items.filter(it => it.title.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q));
    if ((q || activeTag) && items.length === 0) return;
    const filtering = q || activeTag;
    const collapsed = (cat.collapsed && !filtering) ? ' collapsed' : '';
    html += `<div class="nav-group${collapsed}" data-cat="${ci}">
      <div class="nav-group-title"><span class="caret"></span><span class="nav-icon">${cat.icon}</span><span>${escapeHtml(cat.name)}</span><span class="count">${items.length}/${cat.items.length}</span></div>
      <ul class="nav-items">`;
    if (items.length === 0) html += `<li class="nav-empty">空</li>`;
    else items.forEach(it => {
      const active = it.path === currentPath ? ' active' : '';
      html += `<li><a href="#${escapeHtml(encodeURIComponent(it.path))}" class="${active.trim()}" data-path="${escapeHtml(it.path)}" title="${escapeHtml(it.path)}">${escapeHtml(it.title)}</a></li>`;
    });
    html += `</ul></div>`;
  });
  if (!html) html = `<div class="nav-empty">${treeLoaded ? (activeTag ? '该标签下没有文档' : '没有找到 .md 文档') : '正在读取仓库…'}</div>`;
  $('#nav').innerHTML = html;
}

function renderTags() {
  const el = $('#tagCloud');
  if (!MANIFEST) { el.innerHTML = ''; return; }
  const counts = new Map();
  for (const cat of CATEGORIES) for (const it of cat.items) for (const t of (it.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  if (!counts.size) { el.innerHTML = ''; return; }
  const tags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'));
  el.innerHTML = `<div class="tag-list">${tags.map(([t, n]) =>
    `<button class="tag${t === activeTag ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<span class="tag-count">${n}</span></button>`).join('')}</div>` +
    (activeTag ? `<button class="tag-clear" id="tagClear">清除筛选</button>` : '');
}

$('#tagCloud').addEventListener('click', e => {
  if (e.target.closest('#tagClear')) { activeTag = null; renderTags(); renderSidebar($('#search').value); return; }
  const btn = e.target.closest('.tag');
  if (!btn) return;
  const t = btn.dataset.tag;
  activeTag = activeTag === t ? null : t;
  renderTags();
  renderSidebar($('#search').value);
});

$('#nav').addEventListener('click', e => {
  const t = e.target.closest('.nav-group-title');
  if (!t) return;
  const group = t.parentElement;
  group.classList.toggle('collapsed');
  CATEGORIES[+group.dataset.cat].collapsed = group.classList.contains('collapsed');
});

/* ================================================================
 * 9. 路由
 * ================================================================ */
function parseHash() {
  let h = location.hash.slice(1);
  if (!h) return { path: null, anchor: null };
  try { h = decodeURIComponent(h); } catch {}
  const i = h.indexOf('#');
  return i === -1 ? { path: h, anchor: null } : { path: h.slice(0, i), anchor: h.slice(i + 1) };
}

function scrollToAnchor(anchor) {
  const el = document.getElementById(anchor) || document.querySelector(`.md [id="${CSS.escape(anchor)}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ================================================================
 * 10. 欢迎页 / 文档
 * ================================================================ */
function renderWelcome() {
  currentPath = null;
  document.title = 'OI Docs';
  const cards = CATEGORIES.map((c, i) =>
    `<div class="card" data-cat="${i}"><div class="card-icon">${c.icon}</div><h3>${escapeHtml(c.name)}</h3><p>${c.items.length} 篇文档</p></div>`
  ).join('');
  $('#content').innerHTML = `<div class="article"><div class="hero"><h1>OI Docs</h1><p>题解 · 总结 · 算法理论</p></div><div class="card-grid">${cards || '<div class="nav-empty">还没有文档</div>'}</div></div>`;
}

$('#content').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const cat = CATEGORIES[+card.dataset.cat];
  if (cat?.items[0]) location.hash = encodeURIComponent(cat.items[0].path);
});

function showError(html) {
  $('#content').innerHTML = `<div class="article"><div class="error">${html}</div></div>`;
}

function fixLinks(root, mdPath) {
  const dir = mdPath.includes('/') ? mdPath.slice(0, mdPath.lastIndexOf('/') + 1) : '';
  root.querySelectorAll('a[href]').forEach(a => {
    let href = a.getAttribute('href');
    if (!href) return;
    if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('//')) { a.target = '_blank'; a.rel = 'noopener noreferrer'; return; }
    if (href.startsWith('#')) return;
    const [rawPath, anchor] = href.split('#');
    if (/\.md$/i.test(rawPath)) {
      const target = resolvePath(dir, rawPath);
      const isInternal = ITEM_MAP.has(target);
      if (isInternal) a.setAttribute('href', '#' + encodeURIComponent(target) + (anchor ? '#' + anchor : ''));
      else { a.setAttribute('href', `https://github.com/${CONFIG.owner}/${CONFIG.repo}/blob/${CONFIG.branch}/` + encodePath(ROOT + target) + (anchor ? '#' + anchor : '')); a.target = '_blank'; }
    } else {
      a.setAttribute('href', RAW_BASE + encodePath(ROOT + resolvePath(dir, rawPath)) + (anchor ? '#' + anchor : ''));
      a.target = '_blank';
    }
  });
  root.querySelectorAll('img[src]').forEach(img => {
    const src = img.getAttribute('src');
    if (!src || /^[a-z][a-z0-9+.-]*:/i.test(src) || src.startsWith('//')) return;
    const rel = src.startsWith('/') ? src.slice(1) : resolvePath(dir, src);
    img.setAttribute('src', RAW_BASE + encodePath(ROOT + rel));
  });
}

function addHeadingIds(root) {
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
    if (h.id) return;
    h.id = h.textContent.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5\s-]/g, '').replace(/\s+/g, '-');
  });
}

/* ---------- 代码块复制 ---------- */
function attachCopyButtons(mdRoot) {
  mdRoot.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const code = pre.querySelector('code');
    if (!code) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.type = 'button';
    btn.textContent = '复制';
    pre.appendChild(btn);
  });
}

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

$('#content').addEventListener('click', async e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const code = btn.closest('pre')?.querySelector('code');
  if (!code) return;
  const text = code.innerText;
  const ok = await copyText(text);
  if (!ok) return;
  btn.textContent = '已复制';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = '复制';
    btn.classList.remove('copied');
  }, 1500);
});

/* ---------- TOC ---------- */
let tocScrollHandler = null;
let tocRaf = 0;

function setupTOC(mdRoot, path) {
  const toc = document.getElementById('toc');
  if (!toc) return;
  const heads = [...mdRoot.querySelectorAll('h1[id],h2[id],h3[id],h4[id]')];
  if (heads.length < 2) { toc.remove(); return; }

  const list = heads.map(h => {
    const lvl = +h.tagName[1];
    return `<li class="toc-l${lvl}"><a href="#${encodeURIComponent(path)}#${encodeURIComponent(h.id)}" data-id="${escapeHtml(h.id)}">${escapeHtml(h.textContent.trim())}</a></li>`;
  }).join('');

  toc.innerHTML = `<div class="toc-head" id="tocHead"><span>目录</span><span>▾</span></div><ul class="toc-list">${list}</ul>`;
  $('#tocHead').addEventListener('click', () => toc.classList.toggle('collapsed'));

  if (tocScrollHandler) window.removeEventListener('scroll', tocScrollHandler);
  const update = () => {
    let activeId = heads[0].id;
    for (const h of heads) {
      if (h.getBoundingClientRect().top < 100) activeId = h.id; else break;
    }
    toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.id === activeId));
  };
  tocScrollHandler = () => {
    if (tocRaf) return;
    tocRaf = requestAnimationFrame(() => { tocRaf = 0; update(); });
  };
  window.addEventListener('scroll', tocScrollHandler, { passive: true });
  update();
}

async function openDoc(path, anchor) {
  closeSidebar();
  hideSearchResults();
  const item = ITEM_MAP.get(path);
  if (!item) { showError(`未找到文档：<code>${escapeHtml(path)}</code>`); return; }

  document.querySelectorAll('.nav-items a').forEach(a => a.classList.toggle('active', a.dataset.path === path));
  $('#content').innerHTML = `<div class="article"><div class="loading">正在加载 ${escapeHtml(item.title)}…</div></div>`;
  window.scrollTo(0, 0);

  try {
    const text = await fetchMarkdown(path);
    const html = md.render(text);
    const tagsHtml = (item.tags || []).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('');
    $('#content').innerHTML = `<div class="article">
      <h1 class="article-title">${escapeHtml(item.title)}</h1>
      <div class="article-meta">
        <span class="badge">${escapeHtml(item.cat)}</span>
        <span>${escapeHtml(path)}</span>
        ${tagsHtml}
      </div>
      <div class="toc collapsed" id="toc"></div>
      <div class="md">${html}</div>
    </div>`;

    const mdRoot = $('#content .md');
    fixLinks(mdRoot, path);
    addHeadingIds(mdRoot);
    attachCopyButtons(mdRoot);
    setupTOC(mdRoot, path);
    currentPath = path;
    document.title = `${item.title} · OI Docs`;
    if (anchor) setTimeout(() => scrollToAnchor(anchor), 50);
  } catch (err) {
    showError(`<strong>无法加载文档</strong><br>路径：<code>${escapeHtml(path)}</code><br>原因：${escapeHtml(err.message || String(err))}<br><small>请确认文件存在、配置正确，并通过 http(s) 访问页面。</small>`);
  }
}

async function onHashChange() {
  const { path, anchor } = parseHash();
  if (path && path === currentPath) {
    if (anchor) scrollToAnchor(anchor);
    return;
  }
  if (path) await openDoc(path, anchor);
  else renderWelcome();
}

/* ================================================================
 * 11. 全文搜索
 * ================================================================ */
let searchResults = [];
let searchSel = -1;
let searchTimer = null;

function highlight(snippet, q) {
  const s = escapeHtml(snippet);
  const qe = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!qe) return s;
  return s.replace(new RegExp(qe, 'gi'), m => '<mark>' + m + '</mark>');
}

function searchDocs(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const titleHits = [];
  const seen = new Set();
  for (const [path, item] of ITEM_MAP) {
    if (item.title.toLowerCase().includes(q)) {
      titleHits.push({ path, title: item.title, cat: item.cat, anchor: null, snippet: '' });
      seen.add(path);
    }
  }
  const contentHits = [];
  if (SEARCH_INDEX) {
    for (const doc of SEARCH_INDEX) {
      const item = ITEM_MAP.get(doc.path);
      if (!item || seen.has(doc.path)) continue;
      for (const sec of (doc.sections || [])) {
        const i = sec.text.toLowerCase().indexOf(q);
        if (i === -1) continue;
        const start = Math.max(0, i - 30);
        const end = Math.min(sec.text.length, i + q.length + 50);
        const snippet = (start > 0 ? '…' : '') + sec.text.slice(start, end).replace(/\s+/g, ' ').trim() + (end < sec.text.length ? '…' : '');
        contentHits.push({ path: doc.path, title: item.title, cat: item.cat, anchor: sec.id || null, snippet });
        break;
      }
      if (contentHits.length >= 30) break;
    }
  }
  return [...titleHits, ...contentHits].slice(0, 40);
}

function renderSearchResults(q) {
  const box = $('#searchResults');
  if (!searchResults.length) {
    box.innerHTML = `<div class="search-empty">没有结果</div>`;
  } else {
    box.innerHTML = searchResults.map((r, i) => `
      <a class="search-result${i === searchSel ? ' sel' : ''}" data-i="${i}"
         href="#${encodeURIComponent(r.path)}${r.anchor ? '#' + encodeURIComponent(r.anchor) : ''}">
        <div class="sr-title">${highlight(r.title, q)}<span class="sr-cat">${escapeHtml(r.cat)}</span></div>
        ${r.snippet ? `<div class="sr-snippet">${highlight(r.snippet, q)}</div>` : ''}
      </a>`).join('');
  }
  box.classList.add('show');
}

function hideSearchResults() {
  $('#searchResults').classList.remove('show');
  searchResults = [];
  searchSel = -1;
}

function updateSearchSel() {
  $('#searchResults').querySelectorAll('.search-result').forEach((el, i) => {
    el.classList.toggle('sel', i === searchSel);
    if (i === searchSel) el.scrollIntoView({ block: 'nearest' });
  });
}

function goResult(r) {
  hideSearchResults();
  $('#search').blur();
  location.hash = encodeURIComponent(r.path) + (r.anchor ? '#' + r.anchor : '');
}

$('#search').addEventListener('input', e => {
  const q = e.target.value;
  renderSidebar(q);
  clearTimeout(searchTimer);
  searchSel = -1;
  if (!q.trim()) { hideSearchResults(); return; }
  searchTimer = setTimeout(async () => {
    if (MANIFEST) { try { await loadSearchIndex(); } catch {} }
    searchResults = searchDocs(q);
    renderSearchResults(q);
  }, 200);
});

$('#search').addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideSearchResults(); e.target.blur(); return; }
  if (!searchResults.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); searchSel = Math.min(searchSel + 1, searchResults.length - 1); updateSearchSel(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); searchSel = Math.max(searchSel - 1, 0); updateSearchSel(); }
  else if (e.key === 'Enter') {
    if (searchSel >= 0) { e.preventDefault(); goResult(searchResults[searchSel]); }
    else if (searchResults[0]) { e.preventDefault(); goResult(searchResults[0]); }
  }
});

$('#searchResults').addEventListener('click', e => {
  const a = e.target.closest('.search-result');
  if (a) { hideSearchResults(); $('#search').blur(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-container')) hideSearchResults();
});

/* ================================================================
 * 12. 快捷键
 * ================================================================ */
let gPressedAt = 0;
const helpOverlay = $('#helpOverlay');
function toggleHelp(force) {
  const show = force ?? !helpOverlay.classList.contains('show');
  helpOverlay.classList.toggle('show', show);
}
helpOverlay.addEventListener('click', e => { if (e.target === helpOverlay) toggleHelp(false); });
$('#helpBtn').addEventListener('click', () => toggleHelp());

document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

  if (e.key === 'Escape') {
    if (helpOverlay.classList.contains('show')) { toggleHelp(false); return; }
    hideSearchResults();
    closeSidebar();
    if (typing) t.blur();
    return;
  }
  if (typing) return;

  if (e.key === '/') { e.preventDefault(); $('#search').focus(); return; }
  if (e.key === '?') { e.preventDefault(); toggleHelp(); return; }
  if (e.key === 't') { toggleTheme(); return; }
  if (e.key === 'g') { gPressedAt = Date.now(); return; }
  if (e.key === 'h' && Date.now() - gPressedAt < 800) {
    gPressedAt = 0;
    location.hash = '';
  }
});

/* ================================================================
 * 13. 主题 / 侧栏
 * ================================================================ */
const sidebar = $('#sidebar');
const backdrop = $('#backdrop');
function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
$('#menuBtn').addEventListener('click', () => { sidebar.classList.toggle('open'); backdrop.classList.toggle('show'); });
backdrop.addEventListener('click', closeSidebar);

const THEMES = ['light', 'dark', 'ayu'];
let currentTheme = document.documentElement.dataset.theme || 'light';

function applyTheme(theme, persist) {
  if (!THEMES.includes(theme)) theme = 'light';
  const root = document.documentElement;
  root.classList.add('theme-switching');
  root.dataset.theme = theme;
  currentTheme = theme;
  if (persist) localStorage.setItem('oi-docs-theme', theme);
  // 强制重排使新主题立即生效，然后恢复过渡
  void root.offsetWidth;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => root.classList.remove('theme-switching'));
  });
}

function toggleTheme() {
  const idx = THEMES.indexOf(currentTheme);
  applyTheme(THEMES[(idx + 1) % THEMES.length], true);
}

applyTheme(currentTheme, false);
$('#themeBtn').addEventListener('click', toggleTheme);

$('#brandLink').addEventListener('click', e => {
  e.preventDefault();
  location.hash = '';
});
$('#allItemsLink').addEventListener('click', e => {
  e.preventDefault();
  location.hash = '';
});

/* ================================================================
 * 14. 加载 / 同步
 * ================================================================ */
async function loadContent() {
  MANIFEST = null;
  SEARCH_INDEX = null;
  try {
    MANIFEST = await loadManifest();
    CATEGORIES = buildFromManifest(MANIFEST);
  } catch {
    const tree = await fetchTree();
    CATEGORIES = buildDocs(tree);
  }
  treeLoaded = true;
  rebuildItemMap();
  renderTags();
  renderSidebar($('#search').value);
  await onHashChange();
}

$('#refreshBtn').addEventListener('click', async () => {
  $('#refreshBtn').disabled = true;
  try {
    await idb.clear('docs');
    await idb.clear('meta');
    localStorage.removeItem(CACHE_KEY);
    currentPath = null;
    activeTag = null;
    await loadContent();
  } catch (err) {
    showError(`<strong>同步失败</strong><br>${escapeHtml(err.message)}`);
  } finally {
    $('#refreshBtn').disabled = false;
  }
});

/* ================================================================
 * 15. 启动
 * ================================================================ */
async function init() {
  if (!CONFIG.owner || !CONFIG.repo || CONFIG.owner === 'YOUR_GITHUB_USERNAME' || CONFIG.repo === 'YOUR_REPO_NAME') {
    showError(`<strong>尚未配置仓库信息</strong><br>请编辑 <code>CONFIG</code>：<br><code>owner: '你的 GitHub 用户名'</code><br><code>repo:  '你的仓库名'</code>`);
    return;
  }
  renderSidebar();
  $('#content').innerHTML = `<div class="article"><div class="loading">正在读取文档索引…</div></div>`;
  try {
    await loadContent();
  } catch (err) {
    showError(`<strong>初始化失败</strong><br>${escapeHtml(err.message)}`);
  }
}
window.addEventListener('hashchange', onHashChange);
init();
</script>
