<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OI 文档</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

<script>
(function () {
  var saved = localStorage.getItem('oi-docs-theme');
  var theme = ['light', 'dark', 'ayu'].includes(saved) ? saved : 'light';
  document.documentElement.dataset.theme = theme;
})();
</script>

<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<a class="skip-main-content" href="#main-content">跳转到正文</a>
<header class="topbar">
  <button class="btn menu-btn icon-button" id="menuBtn" type="button" aria-label="切换侧栏" aria-expanded="true" title="切换侧栏">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#" aria-label="OI 文档首页"><span class="logo">OI</span><span>OI 文档</span></a>
  <div class="spacer"></div>
  <button class="btn toolbar-button" id="refreshBtn" type="button" title="重新同步文档">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2"/></svg>
    <span>同步</span>
  </button>
  <div class="settings-wrap">
    <button class="btn toolbar-button" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.2 1-1.2 2.1-1.5-.6a8 8 0 0 1-1.5.9l-.3 1.6h-2.4l-.3-1.6a8 8 0 0 1-1.7-.1l-1.1 1.2-2.1-1.2.6-1.5a8 8 0 0 1-.9-1.5l-1.6-.3v-2.4l1.6-.3a8 8 0 0 1 .1-1.7L5.2 9.6l1.2-2.1 1.5.6a8 8 0 0 1 1.5-.9l.3-1.6h2.4l.3 1.6a8 8 0 0 1 1.7.1l1.1-1.2 2.1 1.2-.6 1.5a8 8 0 0 1 .9 1.5l1.6.3V13l-1.6.3a8 8 0 0 1-.2 1.7Z"/></svg>
      <span>设置</span>
    </button>
    <section class="settings-panel" id="settingsPanel" aria-label="外观设置" hidden>
      <h2>外观设置</h2>
      <fieldset>
        <legend>主题</legend>
        <div class="theme-options">
          <button type="button" data-theme-choice="light">浅色</button>
          <button type="button" data-theme-choice="dark">深色</button>
          <button type="button" data-theme-choice="ayu">Ayu</button>
        </div>
      </fieldset>
      <label class="setting-row" for="fontFamily">
        <span>字体</span>
        <select id="fontFamily">
          <option value="sans">无衬线</option>
          <option value="serif">衬线</option>
        </select>
      </label>
      <label class="setting-row" for="fontSize">
        <span>字号</span>
        <select id="fontSize">
          <option value="14">较小</option>
          <option value="16">标准</option>
          <option value="18">较大</option>
          <option value="20">特大</option>
        </select>
      </label>
      <label class="setting-row" for="contentWidth">
        <span>正文宽度</span>
        <select id="contentWidth">
          <option value="720">窄</option>
          <option value="960">标准</option>
          <option value="1200">宽</option>
          <option value="full">自适应</option>
        </select>
      </label>
      <label class="setting-check" for="wrapCode">
        <input id="wrapCode" type="checkbox">
        <span>自动换行代码</span>
      </label>
      <button class="settings-reset" id="resetSettings" type="button">恢复默认设置</button>
    </section>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-heading">
      <span>文档导航</span>
      <span class="sidebar-doc-count" id="docCount"></span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg>
      <input class="search" id="search" type="search" placeholder="搜索文档…" autocomplete="off" aria-label="搜索文档">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div id="tagCloud"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="420" tabindex="0"></div>
  <div class="backdrop" id="backdrop"></div>
  <main id="main-content" tabindex="-1"><div id="content"></div></main>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
